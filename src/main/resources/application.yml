spring:
  application:
    name: billing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15433/billing}
    username: ${SPRING_DATASOURCE_USERNAME:dbadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:senha-super-segura}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  file:
    name: /tmp/app.log
  level:
    root: INFO

management:
  metrics:
    tags:
      service: ${DD_SERVICE:${spring.application.name}}
      env: ${DD_ENV:local}
      version: ${DD_VERSION:local}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  datadog:
    metrics:
      export:
        enabled: ${DD_METRICS_ENABLED:false}
        api-key: ${DD_API_KEY:}
        uri: ${DD_METRICS_URI:https://api.datadoghq.com}
        step: 1m

server:
  port: 8080

# JWT (HS256) — mesmo secret compartilhado pela plataforma (Lambda/os-service).
# O Billing valida o token; não o emite.
jwt:
  secret: ${JWT_SECRET:akmsdkmasfnjsgknakmsdkmasdkmsadfkmdsakmdkmsadsa}

# Mercado Pago (pagamento).
#  - provider=fake (default): adapter determinístico, offline (testes/dev); a
#    decisão vem do webhook simulado POST /api/payments/webhook (só existe aqui).
#  - provider=mercadopago: Checkout Pro (sandbox com access-token TEST-...); a
#    decisão vem do job que consulta GET /v1/payments/search?external_reference=.
payment:
  provider: ${PAYMENT_PROVIDER:fake}
  # Intervalo do job de consulta ao Mercado Pago (só com provider=mercadopago).
  polling-interval-ms: ${PAYMENT_POLLING_INTERVAL_MS:30000}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    base-url: ${MP_BASE_URL:https://api.mercadopago.com}
    # Opcional: a confirmação é por consulta; só preencha se quiser a notificação do MP.
    notification-url: ${MP_NOTIFICATION_URL:}

# Mensageria (Saga) — mesma convenção dos demais serviços.
messaging:
  enabled: ${MESSAGING_ENABLED:false}
  region: ${AWS_REGION:us-east-1}
  endpoint: ${AWS_ENDPOINT:}
  billing-events-topic-arn: ${BILLING_EVENTS_TOPIC_ARN:}
  commands-queue-url: ${BILLING_COMMANDS_QUEUE_URL:}
