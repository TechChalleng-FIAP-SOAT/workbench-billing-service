name: pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn test
      - id: jacoco
        uses: cicirello/jacoco-badge-generator@v2.0.1
      - uses: actions/upload-artifact@v4.4.0
        continue-on-error: true
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 7

  code-analysis:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Verificar qualidade (JaCoCo gate + Sonar)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ]; then
            mvn verify sonar:sonar -Dsonar.token="${SONAR_TOKEN}"
          else
            echo "::warning::SONAR_TOKEN ausente — rodando apenas o gate de cobertura."
            mvn verify
          fi

  build:
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn package -DskipTests

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          HASH=$(git rev-parse --short HEAD)
          echo "image=${{ secrets.DOCKER_USERNAME }}/billing-service:v${VERSION}-${HASH}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/billing-service:latest
            ${{ steps.meta.outputs.image }}

  deploy-aws:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: vars.USE_AWS == 'true' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref_name }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      CLUSTER_NAME: workbench-platform-${{ github.ref_name }}
      IMAGE: ${{ needs.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}"
      - name: Aplicar manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/app.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl set image deployment/billing-service billing-service="${IMAGE}" -n billing-service
          kubectl rollout status deployment/billing-service -n billing-service --timeout=300s
