apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: billing-service
data:
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: billing-service
  SPRING_DATASOURCE_URL: jdbc:postgresql://billing-db:5432/billing
  # Mercado Pago real (Checkout Pro): confirmação pelo job de consulta, sem webhook
  # público. O webhook simulado só existe com "fake" (ambiente local).
  PAYMENT_PROVIDER: "mercadopago"
  DD_ENV: "local"
  DD_SERVICE: "billing-service"
  DD_VERSION: "1.0.0"
  DD_METRICS_ENABLED: "true"
  DD_METRICS_URI: "https://api.datadoghq.com"
